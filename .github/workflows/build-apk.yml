name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Install and initialize Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mikyla.jazmine",
            "appName": "JAZMINE",
            "webDir": "dist"
          }
          EOF
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAZMINE-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
